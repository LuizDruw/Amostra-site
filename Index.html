<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jéssica Chemieski — Psicóloga Clínica e Perinatal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EFE3;
    --cream-deep:#E9E0CC;
    --ink:#2C2A22;
    --ink-soft:#59543F;
    --olive:#48583A;
    --olive-deep:#31402A;
    --sage:#8B9B72;
    --blue:#7FA3BE;
    --blue-deep:#5C84A0;
    --rose:#D98B93;
    --rose-deep:#BE6670;
    --gray-muted:#C7C0AF;
    --max:1040px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:500;
    color:var(--olive-deep);
    letter-spacing:-0.01em;
    margin:0;
  }
  p{margin:0;}
  a{color:inherit;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}
  img,svg{display:block;max-width:100%;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(244,239,227,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(72,88,58,0.12);
  }
  .topbar .wrap{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:16px;padding-bottom:16px;
  }
  .brand{font-family:'Fraunces',serif;font-style:italic;font-size:1.25rem;color:var(--olive-deep);}
  .topnav{display:flex;gap:28px;font-size:0.95rem;}
  .topnav a{text-decoration:none;color:var(--ink-soft);}
  .topnav a:hover{color:var(--olive-deep);}
  .topbtn{
    background:var(--olive);color:var(--cream);
    padding:9px 18px;border-radius:22px;text-decoration:none;font-size:0.9rem;
    white-space:nowrap;
  }
  .topbtn:hover{background:var(--olive-deep);}
  @media(max-width:720px){ .topnav{display:none;} }

  /* ---------- topo: agenda em destaque ---------- */
  .agenda-top{position:relative;overflow:hidden;padding:52px 0 48px;}
  .agenda-top .wrap{position:relative;z-index:2;}
  .agenda-top-leaf{
    position:absolute;top:-36px;right:-36px;width:210px;color:var(--sage);z-index:1;
    opacity:0;animation:fadeIn 1s ease forwards;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{to{opacity:.85;}}

  .agenda-top-head{
    display:flex;align-items:center;gap:14px;
    opacity:0;transform:translateY(10px);animation:rise .7s ease forwards .05s;
  }
  .avatar-photo{border-radius:50%;object-fit:cover;box-shadow:0 18px 36px -18px rgba(49,64,42,0.5);border:3px solid var(--cream);}
  .avatar-xs{width:56px;height:56px;}
  .avatar-sm{width:190px;height:190px;}
  .avatar-lg{width:220px;height:220px;}
  .agenda-name{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--olive-deep);}
  .agenda-cred{font-size:0.85rem;color:var(--ink-soft);margin-top:2px;}

  .agenda-top h1{
    margin-top:24px;font-size:clamp(1.85rem,4vw,2.6rem);line-height:1.16;max-width:17ch;
    opacity:0;transform:translateY(10px);animation:rise .7s ease forwards .15s;
  }
  .agenda-top h1 em{font-style:italic;color:var(--blue-deep);}
  .agenda-top > .wrap > .section-lede{
    opacity:0;transform:translateY(10px);animation:rise .7s ease forwards .22s;
  }
  .agenda-top .legend{opacity:0;transform:translateY(10px);animation:rise .7s ease forwards .28s;}
  .agenda-top .calendar-card{opacity:0;transform:translateY(10px);animation:rise .7s ease forwards .34s;}
  .agenda-top .agenda-note, .agenda-top .hero-ctas{
    opacity:0;transform:translateY(10px);animation:rise .7s ease forwards .4s;
  }

  .hero-ctas{margin-top:26px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;border-radius:26px;text-decoration:none;
    font-size:0.98rem;font-weight:500;border:1px solid transparent;cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--olive);color:var(--cream);}
  .btn-primary:hover{background:var(--olive-deep);}
  .btn-outline{border-color:var(--olive);color:var(--olive-deep);}
  .btn-outline:hover{background:rgba(72,88,58,0.08);}

  @media(max-width:600px){
    .agenda-top-leaf{width:140px;top:-20px;right:-20px;}
    .agenda-top-head{gap:12px;}
    .avatar-xs{width:48px;height:48px;}
  }

  /* ---------- section shell ---------- */
  section{padding:72px 0;}
  .eyebrow-free-title{font-size:clamp(1.5rem,3vw,2.1rem);max-width:16ch;}
  .section-lede{margin-top:14px;color:var(--ink-soft);max-width:56ch;font-size:1.02rem;}

  /* ---------- sobre ---------- */
  .sobre{background:var(--cream-deep);}
  .sobre .wrap{display:flex;gap:56px;align-items:flex-start;}
  .sobre-visual{flex:0.75;position:sticky;top:110px;}
  .sobre-text{flex:1.3;}
  .approach-tag{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--blue);color:#fff;font-size:0.85rem;
    padding:6px 14px;border-radius:20px;margin-top:22px;
  }
  .approach-body{margin-top:18px;color:var(--ink-soft);}
  .approach-body + .approach-body{margin-top:14px;}
  @media(max-width:820px){
    .sobre .wrap{flex-direction:column;}
    .sobre-visual{position:static;}
  }

  /* ---------- vantagens ---------- */
  .vantagens-list{margin-top:38px;}
  .vantagem{
    display:flex;gap:20px;align-items:flex-start;
    padding:26px 0;border-top:1px solid rgba(72,88,58,0.18);
  }
  .vantagem:last-child{border-bottom:1px solid rgba(72,88,58,0.18);}
  .vantagem svg{flex-shrink:0;width:30px;height:30px;color:var(--olive);margin-top:2px;}
  .vantagem h3{font-size:1.08rem;color:var(--olive-deep);font-weight:500;}
  .vantagem p{margin-top:6px;color:var(--ink-soft);font-size:0.97rem;max-width:56ch;}

  /* ---------- quote / mug moment ---------- */
  .quote-band{
    background:var(--olive-deep);
    padding:84px 0;
    display:flex;justify-content:center;
  }
  .blob{
    width:min(420px,86vw);aspect-ratio:1/0.92;
    border-radius:60% 40% 55% 45% / 55% 45% 60% 40%;
    background:var(--olive);
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:40px;position:relative;
  }
  .blob p{
    font-family:'Caveat',cursive;color:var(--cream);
    font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.25;font-weight:600;
  }

  /* ---------- calendário ---------- */
  .agenda{background:var(--cream);}
  .legend{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap;font-size:0.88rem;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .dot.avail{background:var(--blue);}
  .dot.unavail{background:var(--gray-muted);}
  .dot.sel{background:var(--rose);}

  .calendar-card{
    margin-top:32px;background:var(--cream-deep);
    border-radius:18px;padding:28px 26px 32px;
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .cal-head h3{font-size:1.2rem;color:var(--olive-deep);text-transform:capitalize;}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav button{
    width:36px;height:36px;border-radius:50%;border:1px solid rgba(72,88,58,0.3);
    background:transparent;color:var(--olive-deep);cursor:pointer;font-size:1rem;
  }
  .cal-nav button:hover{background:rgba(72,88,58,0.1);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:0.78rem;color:var(--ink-soft);padding-bottom:6px;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:0.92rem;cursor:default;color:var(--ink-soft);
    background:transparent;
  }
  .cal-day.empty{visibility:hidden;}
  .cal-day.available{background:rgba(127,163,190,0.22);color:var(--olive-deep);cursor:pointer;font-weight:500;}
  .cal-day.available:hover{background:rgba(127,163,190,0.4);}
  .cal-day.unavailable{background:rgba(199,192,175,0.28);color:var(--gray-muted);text-decoration:line-through;}
  .cal-day.past{color:rgba(89,84,63,0.3);}
  .cal-day.selected{background:var(--rose)!important;color:#fff!important;}

  .slots-panel{margin-top:24px;display:none;}
  .slots-panel.show{display:block;animation:rise .35s ease;}
  .slots-panel h4{font-size:1rem;color:var(--olive-deep);font-weight:500;margin-bottom:12px;}
  .slots{display:flex;gap:10px;flex-wrap:wrap;}
  .slot-btn{
    padding:10px 18px;border-radius:20px;border:1px solid var(--olive);
    background:transparent;color:var(--olive-deep);font-size:0.92rem;cursor:pointer;
  }
  .slot-btn:hover, .slot-btn.chosen{background:var(--olive);color:var(--cream);}
  .agenda-note{margin-top:18px;font-size:0.83rem;color:var(--ink-soft);}

  /* ---------- contato ---------- */
  .contato{background:var(--olive-deep);color:var(--cream);}
  .contato .wrap{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;align-items:flex-start;}
  .contato h2{color:var(--cream);}
  .contato .section-lede{color:rgba(244,239,227,0.75);}
  .contato-cta{margin-top:26px;}
  .contato-cta .btn-primary{background:var(--rose);color:var(--ink);}
  .contato-cta .btn-primary:hover{background:var(--rose-deep);color:#fff;}
  .contato-meta{font-size:0.92rem;color:rgba(244,239,227,0.75);}
  .contato-meta a{text-decoration:none;border-bottom:1px solid rgba(244,239,227,0.4);}

  footer{background:var(--olive-deep);border-top:1px solid rgba(244,239,227,0.15);padding:22px 0;}
  footer .wrap{display:flex;justify-content:space-between;color:rgba(244,239,227,0.55);font-size:0.82rem;flex-wrap:wrap;gap:8px;}

  @media(max-width:600px){
    .wrap{padding:0 20px;}
    section{padding:52px 0;}
    .cal-day{font-size:0.8rem;}
  }
</style>
</head>

</div>
